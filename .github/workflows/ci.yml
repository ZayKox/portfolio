name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          actionlint_version="1.7.12"
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --location --silent --show-error \
            --output "/tmp/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          echo "${actionlint_sha256}  /tmp/${actionlint_archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${actionlint_archive}" --directory /tmp actionlint
          /tmp/actionlint

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Verify
        run: npm run verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Audit representative pages with Lighthouse
        run: npm run test:lighthouse

      - name: Test browsers and accessibility
        run: npm run test:e2e

      - name: Check external links
        run: npm run check:links

      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
            docs/qa/external-links.json
          if-no-files-found: ignore
          retention-days: 7
